name: Native (Swift) CI

# Build + test only. The app is signed and installed locally (no Apple
# Developer Program, no distribution), so nothing here needs a secret.

on:
  push:
    branches: [main]
    paths:
      - "DKBSourceControlApp/**"
      - "DKBSourceControlAppTests/**"
      - "DKBSourceControlCore/**"
      - "DKBSourceControlNative.xcodeproj/**"
      - ".github/workflows/native-ci.yml"
  pull_request:
    paths:
      - "DKBSourceControlApp/**"
      - "DKBSourceControlAppTests/**"
      - "DKBSourceControlCore/**"
      - "DKBSourceControlNative.xcodeproj/**"
      - ".github/workflows/native-ci.yml"

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Test DKBSourceControlCore (headless package)
        working-directory: DKBSourceControlCore
        run: swift test

      # Local.xcconfig is gitignored (per-machine signing identity); the
      # example is ad-hoc, which is all a compile check needs.
      - name: Create Local.xcconfig
        run: cp Local.xcconfig.example Local.xcconfig

      - name: Build DKBSourceControlApp
        run: |
          xcodebuild -project DKBSourceControlNative.xcodeproj -scheme DKBSourceControlApp -configuration Debug build \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
